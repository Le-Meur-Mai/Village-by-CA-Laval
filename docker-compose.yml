services:
  backend:
    build: ./backend
    # Docker va lire la dockerfile dans backend/
    container_name: backend
    # nom du conteneur
    ports:
      - "3000:3000"
      - "5555:5555"
      # le backend est accessible sur le port localhost:3000
    volumes:
      - ./backend/src:/backend/src
      # Quand on modifiera le code, docker le verra et reloadera.
      - ./backend/prisma:/backend/prisma

    depends_on:
      db:
        condition: service_healthy
      # Le backend démarre après la base de données mySQL
    env_file:
      - ./backend/.env
      # Le backend se connecte à MySQL via le nom du service Docker : db + charge le .env
    
    # On attends que la db est fini de chargée avant de lancer l'initialisation des données
    command: >
      sh -c "
        npx prisma db push --accept-data-loss &&
        npx prisma db seed &&
        npm start
      "
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/villageByCa:/frontend/villageByCa
      - /frontend/villageByCa/node_modules


    depends_on:
      - backend
      # Le frontend se lance après le backend

  db:
    image: mysql:8
    # Utilises l’image officielle de mySQL 8
    container_name: mysql
    restart: always
    # MySQL plante (ça arrive) Docker le relance immédiatement.
    environment:
      MYSQL_ROOT_PASSWORD: password
      # La base de donnée démarre avec le mot de passe
      MYSQL_DATABASE: village_by_ca_database
      # Le nom de la base de données
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Sauvegarde persistante des données MySQL, même si le conteneur est supprimé
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  # Crée un volume nommé mysql_data sur notre machine (on stocke les données de la database sur notre machine en phase de développement.